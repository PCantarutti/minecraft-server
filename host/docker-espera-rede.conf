# Drop-in do docker.service: /etc/systemd/system/docker.service.d/espera-rede.conf
#
# O netplan deste host não ativa systemd-networkd-wait-online, então
# network-online.target sobe antes da enp2s0 ter rota. O Docker subia ~2s antes
# da rede, o Minecraft tentava baixar o Paper sem rota (ENETUNREACH) e ficava em
# loop até ser recriado. Aqui o dockerd espera a rota default do host.
#
# ponytail: teto de 60s e sai 0 mesmo sem rota — a stack igenda sobe de
# qualquer jeito; sem rede só o download do Minecraft falha, como antes.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do ip -4 route show default | grep -q . && exit 0; sleep 1; done; exit 0'
