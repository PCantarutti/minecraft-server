# Drop-in do docker.service: /etc/systemd/system/docker.service.d/espera-rede.conf
#
# O netplan deste host não ativa systemd-networkd-wait-online, então
# network-online.target sobe antes da enp2s0 ter rota. O Docker subia ~2s antes
# da rede, o Minecraft tentava baixar o Paper sem rota (ENETUNREACH) e ficava em
# loop até ser recriado. Aqui o dockerd espera a rota default do host.
#
# Também espera o IP da tailscale0: MC_BIND e PANEL_BIND são o IP da tailnet.
# Se o dockerd sobe antes do tailscaled, o publish da porta falha com
# "cannot assign requested address" e o Docker NÃO tenta de novo — container
# que falha no start do daemon fica parado até alguém mexer. Era por isso que
# o painel às vezes não subia no boot.
#
# ponytail: teto de 90s e sai 0 mesmo sem rede — a stack igenda sobe de
# qualquer jeito; sem tailnet só painel/Minecraft ficam fora, como antes.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 90); do ip -4 route show default | grep -q . && ip -4 addr show tailscale0 2>/dev/null | grep -q inet && exit 0; sleep 1; done; exit 0'
