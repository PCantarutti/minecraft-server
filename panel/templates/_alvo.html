{% include "_cabecalho.html" %}

<div class="tabs" id="abas-{{ chave }}">
  {% for id, nome in spec.abas %}
  <button class="{% if id == aba %}on{% endif %}"
          hx-get="/f/aba/{{ chave }}/{{ id }}" hx-target="#conteudo" hx-swap="innerHTML"
          hx-on::after-request="this.closest('.tabs').querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');var c=document.getElementById('cabecalho'); if(c) c.setAttribute('hx-get','/f/cabecalho/{{ chave }}/{{ id }}');">
    {{ nome }}
  </button>
  {% endfor %}
</div>

<div class="main-scroll">
  <div id="conteudo"{% if not conteudo_html %} hx-get="/f/aba/{{ chave }}/{{ aba }}" hx-trigger="load" hx-swap="innerHTML"{% endif %}>
    {% if conteudo_html %}{{ conteudo_html | safe }}
    {% else %}<div class="card"><span class="dim">carregando…</span></div>{% endif %}
  </div>
</div>
